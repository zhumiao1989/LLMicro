[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmicro"
version = "1.0.0"
description = "Robust metagenomic profiling of complex microbial communities using large language models"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Miao Zhu", email = "zhumiao@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "loguru>=0.7.0",
    "click>=8.0.0",
    "jsonlines>=4.0.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]
bio = [
    "biopython>=1.81",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "llmicro[llm,bio,test]",
]

[project.scripts]
llmicro-recommend = "src.llm_recommender:main"
llmicro-simulate = "src.simulate_data:main"
llmicro-evaluate = "src.evaluate:main"
llmicro-visualize = "src.visualize:main"
llmicro-kraken2 = "src.run_kraken2:main"
llmicro-centrifuge = "src.run_centrifuge:main"
llmicro-pathseq = "src.run_pathseq:main"

[project.urls]
Homepage = "https://github.com/your-org/llmicro"
Documentation = "https://github.com/your-org/llmicro#readme"
Repository = "https://github.com/your-org/llmicro.git"
Issues = "https://github.com/your-org/llmicro/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
